[project]
name = "bom-to-spend-tie-out"
version = "0.1.0"
description = "Ties bills of materials to purchasing records from messy CSV exports"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "numpy",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pandas",
    "scikit-learn>=1.9.1",
    "sentence-transformers",
    "streamlit>=1.67.0",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
