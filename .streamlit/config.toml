[theme]
base = "light"
primaryColor = "#087F43"
backgroundColor = "#EDF0F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1B2D"
borderColor = "#D9DEE6"
font = "Inter, sans-serif"
headingFont = "'Bricolage Grotesque', Inter, sans-serif"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-wght-normal.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/bricolage-grotesque-latin-wght-normal.woff2"
weight = "200 800"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 5
enableStaticServing = true

[browser]
gatherUsageStats = false
